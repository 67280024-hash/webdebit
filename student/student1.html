<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
</head>
<style>
    .students-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 32px;
        /* เพิ่มช่องว่าง */
        justify-content: center;
        padding: 40px;
    }



    .student-card {
        position: relative;

        width: 230px;
        background-color: #ffffff;
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        text-align: center;
        flex: 0 0 260px;
    }


    .status-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: #2ecc71;
        color: white;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
    }


    .card-image {
        width: 100%;
        height: 150px;
        object-fit: contain;

        margin-bottom: 10px;
    }

    .student-name {
        font-weight: bold;
        margin: 8px 0;
    }

    .student-major {
        font-size: 14px;
        color: #666;
    }


    .info-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-top: 10px;
    }


    .student-gpa {
        margin-top: 10px;
        font-weight: bold;
        color: #3b6cff;
    }

    .cards-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        padding: 20px;
    }


    .student-card {
        background: #ffffff;
        padding: 20px;
        border-radius: 18px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
        transition: all 0.25s ease;
        cursor: pointer;
    }


    .student-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
    }


    .student-card__avatar {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #fff;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }


    .student-card__header {
        display: flex;
        align-items: center;
        gap: 12px;
    }


    .student-card__name {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        color: #111827;
    }


    .student-card__title {
        margin: 2px 0 0;
        color: #6b7280;
        font-size: 0.9rem;
    }

    .student-card__bio {
        margin-top: 10px;
        color: #4b5563;
        font-size: 0.95rem;
        line-height: 1.4;
    }


    .student-card__meta {
        list-style: none;
        padding: 0;
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #f3f4f6;
        padding-top: 12px;
    }

    .student-card__meta li {
        text-align: center;
    }

    .student-card__meta strong {
        display: block;
        font-size: 1.05rem;
        color: #111827;
    }
</style>

<body>
