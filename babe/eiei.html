<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Valentine Cards</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at center, #1a001a, #000);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

/* ===== CANVAS ===== */
canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 0;
}

/* ===== CARD BASE ===== */
.card {
    position: absolute;
    width: 220px;
    padding: 20px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 182, 193, 0.3);
    box-shadow: 0 0 25px rgba(255, 105, 180, 0.25);
    color: white;
    text-align: center;
    transition: 0.3s ease;
    z-index: 2;
}

.card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(255, 105, 180, 0.6);
}

/* ===== POSITION ===== */
.top-left { top: 40px; left: 40px; }
.top-right { top: 40px; right: 40px; }
.bottom-left { bottom: 40px; left: 40px; }
.bottom-right { bottom: 40px; right: 40px; }

.card img {
    width: 100px;          /* ขนาดรูป */
    height: 100px;
    object-fit: cover;     /* ไม่ยืด */
    border-radius: 50%;    /* ทำให้กลม */
    margin: 10px 0;
    border: 3px solid #ff9bbd;
    box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
}


/* ===== HEART SPIN ===== */
.heart {
    font-size: 28px;
    margin-bottom: 10px;
    display: inline-block;
    animation: spin 4s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.card h3 {
    margin: 0 0 10px;
    color: #ff9bbd;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="card top-left">
    <div class="heart">💖</div>
    <img src="babe01.jpg">
    <h3>Happy Valentine</h3>
    <p>May your day be filled with love and sweetness.</p>
</div>

<div class="card top-right">
    <div class="heart">💘</div>
    <img src="babe02.jpg">
    <h3>Forever Love</h3>
    <p>You make every moment magical and bright.</p>
</div>

<div class="card bottom-left">
    <div class="heart">💕</div>
    <img src="babe04.jpg">
    <h3>Sweet Moments</h3>
    <p>Every smile of yours means the world to me.</p>
</div>

<div class="card bottom-right">
    <div class="heart">💝</div>
    <img src="babe03.jpg">
    <h3>Be Mine</h3>
    <p>Today and always, my heart is yours.</p>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

ctx.font = "20px monospace";
ctx.fillStyle = "#ff9bbd";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.shadowColor = "#ff9bbd";
ctx.shadowBlur = 15;

const text = "Happy Valentine's Day! kab Babe JubJub ";
let angleOffset = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = Math.min(canvas.width, canvas.height) / 3;

  let totalWidth = 0;
  for (let char of text) {
    totalWidth += ctx.measureText(char).width;
  }

  let currentAngle = angleOffset;

  for (let char of text) {
    const charWidth = ctx.measureText(char).width;
    const angle = (charWidth / totalWidth) * (Math.PI * 2);

    const x = cx + radius * Math.cos(currentAngle);
    const y = cy + radius * Math.sin(currentAngle);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(currentAngle + Math.PI / 2);
    ctx.fillText(char, 0, 0);
    ctx.restore();

    currentAngle += angle;
  }

  angleOffset -= 0.01;
  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
