<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Heart Text</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
  }
  canvas { display: block; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ===== STYLE =====
ctx.font = "15px monospace";
ctx.fillStyle = "#ff9bbd";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.shadowColor = "#ff9bbd";
ctx.shadowBlur = 18;

// ===== TEXT =====
const text = "I love you ";
let textIndex = 0;

// ===== HEART FORMULA =====
function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y:
      13 * Math.cos(t) -
      5 * Math.cos(2 * t) -
      2 * Math.cos(3 * t) -
      Math.cos(4 * t)
  };
}

// ===== DRAW =====
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const scale = Math.min(canvas.width, canvas.height) / 35;

  let t = 0;
  let step = 0.06;

  while (t < Math.PI * 2) {
    const p = heart(t);
    const char = text[textIndex % text.length];

    ctx.save();
    ctx.translate(cx + p.x * scale, cy - p.y * scale);
    ctx.rotate(t);
    ctx.fillText(char, 0, 0);
    ctx.restore();

    textIndex++;
    t += step;
  }
}

draw();
</script>

</body>
</html>
